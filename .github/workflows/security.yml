# NOTA (2026-11-05): este workflow esta en rojo a proposito.
#
# Lo unico que queda sin corregir es nodemailer: el arreglo recien esta en la
# 10.x y nosotros estamos en la 9, asi que es un salto de version mayor. Se
# dejo pendiente porque el vector no es alcanzable desde afuera: nodemailer
# solo manda los mails de contraseña del staff y nunca ve el buyer_email que
# carga cualquiera en el formulario publico.
#
# No silenciar el job. Hacer el salto en una semana tranquila y comprobar que
# los mails de recupero de contraseña siguen saliendo.

# npm audit en cada PR y push a master, mas un cron semanal por las dudas
# (deps no cambian pero pueden salir CVEs nuevas en deps existentes).
#
# Falla el job si hay vulnerabilidades high o critical en prod (--omit=dev).
# Las moderate solo loguean. Las dev quedan ignoradas porque corren en dev
# machines, no en prod.
name: security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Lunes 09:00 UTC
    - cron: '0 9 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install (ci)
        run: npm ci

      - name: npm audit (prod) — fail si high o critical
        run: npm audit --audit-level=high --omit=dev

      - name: npm audit (full) — informativo
        if: always()
        run: npm audit || true
