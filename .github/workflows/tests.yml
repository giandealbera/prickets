# Corre la suite e2e del backend y compila el frontend en cada push y PR a
# master. La idea es que un error que ya arreglamos no vuelva a produccion
# sin que nadie se de cuenta: la suite incluye un bloque de regresiones con
# los bugs que se nos escaparon (check-in por encima del 100%, cortesias
# inflando lo recaudado, QR de cortesia ajena recuperable, permisos que se
# perdian al clonar, y el cupo de rate limit compartido por IP).
name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: backend — e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install (ci)
        run: npm ci

      - name: Suite e2e
        # run-e2e levanta el server con una base SQLite temporal, corre los
        # checks y apaga todo. No necesita servicios externos.
        run: npm test
        env:
          JWT_SECRET: secreto_solo_para_ci

  backend-pg:
    name: backend — e2e sobre PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Produccion corre sobre PostgreSQL y la suite de arriba sobre SQLite.
    # Pasar en SQLite no garantiza nada: en este proyecto ya se escaparon asi
    # un ALTER que corria antes de existir la tabla, timestamps leidos con 3
    # horas de corrimiento, y conteos que volvian como texto en vez de numero.
    # Este job corre los mismos checks contra el motor de verdad.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prickets_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install (ci)
        run: npm ci

      - name: Suite e2e contra PostgreSQL
        # El server y la suite van en el MISMO step a proposito: un proceso
        # en segundo plano no sobrevive de forma confiable entre steps.
        run: |
          node server.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4100/api/health >/dev/null && break
            sleep 1
          done
          node scripts/e2e-test.js || { echo '--- log del server ---'; cat /tmp/server.log; exit 1; }
        env:
          PORT: '4100'
          E2E_URL: http://127.0.0.1:4100/api
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/prickets_ci
          PGSSL: disable
          NODE_ENV: development
          JWT_SECRET: secreto_solo_para_ci
          MAIL_DEV_STUB: '1'

  frontend:
    name: frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install (ci)
        run: npm ci

      - name: Build
        # Un error de sintaxis o un import roto rompen el build: es la red
        # que hubiera atajado el import borrado que dejo la app en blanco.
        run: npm run build
